<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Segmentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
        <h2 class="text-2xl font-bold text-center text-indigo-400 mb-1">Customer Segmentation</h2>
        <p class="text-xs text-gray-400 text-center mb-6">K-Means Machine Learning Clustering</p>

        <form id="segmentForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Annual Income ($k):</label>
                <input type="number" id="income" required placeholder="e.g. 80" min="1" max="250"
                    class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Spending Score (1 - 100):</label>
                <input type="number" id="spending_score" required placeholder="e.g. 75" min="1" max="100"
                    class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-semibold transition duration-200 shadow-md">
                Predict Customer Segment
            </button>
        </form>

        <div id="result" class="hidden mt-6 p-4 rounded-lg bg-gray-700 border border-indigo-500/30">
            <h3 class="text-xs uppercase tracking-wider text-gray-400">Target Segment</h3>
            <p id="segmentName" class="text-lg font-bold text-green-400 mt-1"></p>
            <p id="segmentDesc" class="text-sm text-gray-300 mt-1"></p>
        </div>
    </div>

    <script>
        document.getElementById('segmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const income = document.getElementById('income').value;
            const spending_score = document.getElementById('spending_score').value;

            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ income, spending_score })
            });

            const data = await res.json();
            if (data.status === 'success') {
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('segmentName').innerText = data.segment_name;
                document.getElementById('segmentDesc').innerText = data.description;
            } else {
                alert("Error: " + data.message);
            }
        });
    </script>
</body>
</html>
